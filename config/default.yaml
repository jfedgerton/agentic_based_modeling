# Default experiment configuration

experiment:
  name: "default_experiment"
  random_seed: 42
  num_steps: 100
  num_replications: 5
  output_dir: "outputs"
  log_dir: "logs"

# Prisoner's Dilemma Grid defaults
pd_grid:
  width: 20
  height: 20
  payoff_matrix:
    # (my_action, their_action) -> my_payoff
    CC: 3  # both cooperate
    CD: 0  # I cooperate, they defect
    DC: 5  # I defect, they cooperate
    DD: 1  # both defect
  initial_cooperation_prob: 0.5
  neighborhood: "moore"  # "moore" or "von_neumann"

# Interstate Conflict defaults
interstate_conflict:
  width: 20
  height: 20
  bluffing_enabled: true
  bluffing_rate: 0.3
  capability_dist: [2.0, 2.0]    # [alpha, beta] for Beta distribution
  war_cost_dist: [2.0, 5.0]
  capability_range: [0.1, 0.9]   # [min, max]
  war_cost_range: [0.1, 0.5]

# Jury Deliberation defaults
jury_deliberation:
  n_jurors: 12
  max_rounds: 10
  mixing_alpha: 0.3
  classic_noise_sigma: 0.15
  ground_truth: "GUILTY"
  status_permutation: false
  case_description: "[TBD: case description placeholder]"
  testimony: "[TBD: testimony placeholder]"

# Civil Violence defaults
civil_violence:
  width: 40
  height: 40
  citizen_density: 0.7
  cop_density: 0.04
  citizen_vision: 7
  cop_vision: 7
  legitimacy: 0.82
  max_jail_term: 30
  movement: true

# Agent architecture
agent:
  type: "classic"  # "classic", "llm", "hybrid"

# LLM configuration
llm:
  provider: "mock"  # "openai", "anthropic", "mock"
  model: "gpt-5.4-mini"
  temperature: 0.0
  max_tokens: 256
  cache_enabled: true
  cache_dir: ".llm_cache"
  rate_limit_delay: 0.1  # seconds between API calls

# Logging
logging:
  level: "INFO"
  log_prompts: true
  log_responses: true
  log_rationales: true
  log_parse_failures: true
  log_metrics: true
